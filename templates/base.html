<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Учёт участия{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="site-header__brand" href="{{ url_for('main_view_bp.teachers_page') }}">Участие в мероприятиях</a>

        <div class="dropdown">
            <button class="dropdown__toggle" type="button" data-dropdown-toggle>
                Справочники
            </button>
            <div class="dropdown__menu">
                <a class="dropdown__item" href="{{ url_for('main_view_bp.users_page') }}">Участники</a>
                <a class="dropdown__item" href="{{ url_for('main_view_bp.events_page') }}">Мероприятия</a>
                <a class="dropdown__item" href="{{ url_for('main_view_bp.levels_page') }}">Уровни</a>
            </div>
        </div>

        <a class="nav__link {% if request.path == '/teachers' %}nav__link--active{% endif %}"
           href="{{ url_for('main_view_bp.teachers_page') }}">Работники</a>
        <a class="nav__link {% if request.path == '/students' %}nav__link--active{% endif %}"
           href="{{ url_for('main_view_bp.students_page') }}">Студенты</a>
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer class="site-footer">
    <div class="site-footer__inner">
        <div class="site-footer__main">
            <span class="site-footer__label">Разработчик</span>
            <span class="site-footer__name">Шигин Илья</span>
        </div>
        <div class="site-footer__divider"></div>
        <div class="site-footer__main">
            <span class="site-footer__label">Организация</span>
            <span class="site-footer__org">АПОУ ВО «ВКСиИТ»</span>
        </div>
    </div>
</footer>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
