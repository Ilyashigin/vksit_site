<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Учёт участия{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="site-header__brand" href="{{ url_for('main_view_bp.ped_rab_page') }}">Учёт участия ВКСиИТ</a>

        <div class="dropdown">
            <button class="dropdown__toggle" type="button" data-dropdown-toggle>
                Справочники
            </button>
            <div class="dropdown__menu">
                <a class="dropdown__item" href="{{ url_for('main_view_bp.user_page') }}">Все участники</a>
                <a class="dropdown__item" href="{{ url_for('main_view_bp.event_page') }}">Все мероприятия</a>
                <a class="dropdown__item" href="{{ url_for('main_view_bp.level_page') }}">Все уровни</a>
            </div>
        </div>

        <a class="nav__link {% if request.path == '/rabotniki' %}nav__link--active{% endif %}"
           href="{{ url_for('main_view_bp.ped_rab_page') }}">Работники</a>
        <a class="nav__link {% if request.path == '/students' %}nav__link--active{% endif %}"
           href="{{ url_for('main_view_bp.stud_page') }}">Студенты</a>
    </div>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="{{ url_for('static', filename='ui.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
