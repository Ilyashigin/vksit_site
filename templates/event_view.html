{% extends 'base.html' %}
{% block title %}Список мероприятий{% endblock %}
{% block content %}

<h1 class="page-title">Мероприятия</h1>

<div class="toolbar">
    <button type="button" class="btn btn--primary" onclick="openEventModal('add')">
        Добавить мероприятие
    </button>
</div>

<div class="card">
    <div class="card__body">
        <div id="loading-events" class="loading">
            <div class="spinner"></div>
        </div>
        <div class="table-wrap">
            <table class="table" id="event-table" style="display:none;">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Название</th>
                        <th>Описание</th>
                        <th>Уровень</th>
                        <th>Дата</th>
                        <th class="table__actions">Действия</th>
                    </tr>
                </thead>
                <tbody id="event-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal" id="eventModal">
    <div class="modal__overlay"></div>
    <div class="modal__dialog">
        <div class="modal__header">
            <h5 class="modal__title" id="modalTitle">Добавить мероприятие</h5>
            <button type="button" class="modal__close" data-modal-close>&times;</button>
        </div>
        <div class="modal__body">
            <form id="eventForm">
                <input type="hidden" id="editId">
                <div class="form-group" style="margin-bottom:12px;">
                    <label class="form-label">Название мероприятия</label>
                    <input type="text" class="form-control" id="m_name" required
                           placeholder="Например: Олимпиада по программированию">
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label class="form-label" for="m_description">Описание</label>
                    <textarea class="form-control" id="m_description" rows="3"
                              placeholder="Необязательно"></textarea>
                </div>
                <div class="form-group" style="margin-bottom:12px;">
                    <label class="form-label" for="m_date">Дата проведения</label>
                    <input type="text" class="form-control form-control--date" id="m_date"
                           placeholder="Выберите дату или период" autocomplete="off" required readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Уровень мероприятия</label>
                    <input type="text" class="form-control" id="m_level" list="dl_levels"
                           autocomplete="off" placeholder="Например: Международный" required>
                    <datalist id="dl_levels"></datalist>
                </div>
            </form>
        </div>
        <div class="modal__footer">
            <button type="button" class="btn btn--secondary" data-modal-close>Отмена</button>
            <button type="button" class="btn btn--primary" onclick="saveEvent()">Сохранить</button>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
<script src="{{ url_for('static', filename='event_view.js') }}"></script>
{% endblock %}
