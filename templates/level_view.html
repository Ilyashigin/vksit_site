{% extends 'base.html' %}
{% block title %}Список уровней{% endblock %}
{% block content %}

<h1 class="page-title">Уровни мероприятий</h1>

<div class="toolbar">
    <button type="button" class="btn btn--primary" onclick="openLevelModal('add')">
        Добавить уровень
    </button>
</div>

<div class="card">
    <div class="card__body">
        <div id="loading-levels" class="loading">
            <div class="spinner"></div>
        </div>
        <div class="table-wrap">
            <table class="table" id="level-table" style="display:none;">
                <thead>
                    <tr>
                        <th>№</th>
                        <th>Уровень мероприятия</th>
                        <th class="table__actions">Действия</th>
                    </tr>
                </thead>
                <tbody id="level-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal" id="levelModal">
    <div class="modal__overlay"></div>
    <div class="modal__dialog">
        <div class="modal__header">
            <h5 class="modal__title" id="modalTitle">Добавить уровень</h5>
            <button type="button" class="modal__close" data-modal-close>&times;</button>
        </div>
        <div class="modal__body">
            <form id="levelForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label class="form-label">Название уровня</label>
                    <input type="text" class="form-control" id="m_level" required
                           placeholder="Например: Международный">
                </div>
            </form>
        </div>
        <div class="modal__footer">
            <button type="button" class="btn btn--secondary" data-modal-close>Отмена</button>
            <button type="button" class="btn btn--primary" onclick="saveLevel()">Сохранить</button>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='level_view.js') }}"></script>
{% endblock %}
