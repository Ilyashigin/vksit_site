{% extends 'base.html' %}
{% block content %}
<h1>Добавить мероприятие для работника</h1>
<div class="col-6">
  <form method="post" action="{{ url_for('ped_rab_edit', id= rabotnik.id) }}">
    <div class="mb-3">
      <label for="meropriyatie" class="form-label">Мероприятие</label>
      <input type="text" class="form-control" id="meropriyatie" name="meropriyatie" value="{{ rabotnik.meropriyatie }}" required>
    </div>
    <div class="mb-3">
      <label for="uroven" class="form-label">Уровень</label>
      <input type="text" class="form-control" id="uroven" name="uroven" value="{{ rabotnik.uroven }}" required>
    </div>
    <div class="mb-3">
      <label for="sroki_provedeniya" class="form-label">Сроки проведения</label>
      <input type="text" class="form-control" id="sroki_provedeniya" name="sroki_provedeniya" value="{{ rabotnik.sroki_provedeniya }}" required>
    </div>
    <div class="mb-3">
      <label for="rezultat" class="form-label">Результат</label>
      <input type="text" class="form-control" id="rezultat" name="rezultat" value="{{ rabotnik.rezultat }}" required>
    </div>
    <div class="mb-3">
      <label for="fio" class="form-label">ФИО</label>
      <input type="text" class="form-control" id="fio" name="fio" value="{{ rabotnik.fio }}" required>
    </div>
    <div class="mb-3">
      <label for="diplomi" class="form-label">Дипломы</label>
      <input type="text" class="form-control" id="diplomi" name="diplomi" value="{{ rabotnik.diplomi }}" required>
    </div>
    <div class="mb-3">
      <label for="nagradi" class="form-label">Награды</label>
      <input type="text" class="form-control" id="nagradi" name="nagradi" value="{{ rabotnik.nagradi }}" required>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>
</div>
{% endblock %}
