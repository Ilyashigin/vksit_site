{% extends 'base.html' %}
{% block content %}
<h1>Добавить мероприятие для студента</h1>
<div class="col-6">
  <form method="post" action="{{ url_for('students_add') }}">
    <div class="mb-3">
      <label for="meropriyatie" class="form-label">Мероприятие</label>
      <input type="text" class="form-control" list="list_mer" id="meropriyatie" name="meropriyatie" required>
      <datalist id="list_mer">
        {% for mer in mers %}
        <option value="{{ mer.name }}">
        {% endfor %}
      </datalist>
    </div>
    <div class="mb-3">
      <label for="uroven" class="form-label">Уровень</label>
      <input type="text" class="form-control" list="list_uroven" id="uroven" name="uroven" required>
      <datalist id="list_uroven">
        {% for ur in urovni %}
        <option value="{{ ur.uroven_name }}">
        {% endfor %}
      </datalist>
    </div>
    <div class="mb-3">
      <label for="sroki_provedeniya" class="form-label">Сроки проведения</label>
      <input type="text" class="form-control" id="sroki_provedeniya" name="sroki_provedeniya" placeholder="Вручную или календарь" required>
    </div>
    <div class="mb-3">
      <label for="rezultat" class="form-label">Результат</label>
      <input type="text" class="form-control" id="rezultat" name="rezultat" required>
    </div>
    <div class="mb-3">
      <label for="fio" class="form-label">ФИО</label>
      <input class="form-control" list="datalistOptions" id="fio" placeholder="Поиск" name="fio">
      <datalist id="datalistOptions">
        {% for user in user_stud %}
        {% if user.group %}
        <option value="{{ user.fio }}">
        {% endif %}
        {% endfor %}
      </datalist>
    </div>
    <div class="mb-3">
      <label for="group" class="form-label">Группа</label>
      <input type="text" class="form-control" list="group_list" id="group" name="group" required>
      <datalist id="group_list">
        {% for user in user_stud %}
        {% if user.group %}
        <option value="{{ user.group }}">
        {% endif %}
        {% endfor %}
      </datalist>
    </div>
    <div class="mb-3">
      <label for="diplomi" class="form-label">Дипломы</label>
      <input type="text" class="form-control" id="diplomi" name="diplomi" required>
    </div>
    <div class="mb-3">
      <label for="nagradi" class="form-label">Награды</label>
      <input type="text" class="form-control" id="nagradi" name="nagradi" required>
    </div>
    <div class="mb-3">
      <label for="fio_nastavnika" class="form-label">ФИО наставника/преподавателя</label>
      <input type="text" class="form-control" list="fio_nastavn" id="fio_nastavnika" name="fio_nastavnika" required>
      <datalist id="fio_nastavn">
        {% for user in user_stud %}
        {% if user.group == none %}
        <option value="{{ user.fio }}">
        {% endif %}
        {% endfor %}
      </datalist>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </form>
</div>



<!-- Flatpickr (календарь + русификация) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/ru.js"></script>

<script>
  const input = document.getElementById('sroki_provedeniya');

  // Инициализация календаря с разрешением ручного ввода
  const fp = flatpickr(input, {
    locale: 'ru',
    allowInput: true,          // разрешаем печатать текст
    dateFormat: 'd.m.Y',       // формат после выбора в календаре
    parseDate: (dateStr) => parseNaturalDate(dateStr), // наш парсер
    onChange: (selectedDates, dateStr) => {
      // При выборе календарём обновляем значение в поле
      input.value = dateStr;
    }
  });

  /**
   * Лёгкий парсер русских дат и естественных выражений
   * Для продакшена с полной NLP-поддержкой рекомендую chrono-node
   */
  function parseNaturalDate(str) {
    if (!str) return null;
    str = str.toLowerCase().trim();

    const today = new Date();
    const monthsFull = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const monthsShort = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

    // Быстрые слова
    if (str === 'сегодня') return today;
    if (str === 'завтра') return new Date(today.getTime() + 86400000);
    if (str === 'послезавтра') return new Date(today.getTime() + 2 * 86400000);
    if (str.includes('до конца недели') || str.includes('к концу недели')) {
      const d = new Date(today);
      d.setDate(today.getDate() + (7 - today.getDay()));
      return d;
    }

    // Форматы: "15 мая", "10 мая 2024", "10.05.2024", "10/05/24"
    const match = str.match(/(\d{1,2})[\s\.\/-]+([а-яёa-z]{2,10})[\s\.\/-]*(\d{4}|\d{2})?/);
    if (match) {
      let day = parseInt(match[1]);
      let monthStr = match[2];
      let year = match[3] ? (match[3].length === 2 ? 2000 + parseInt(match[3]) : parseInt(match[3])) : today.getFullYear();
      let month = monthsFull.indexOf(monthStr) > -1 ? monthsFull.indexOf(monthStr) : monthsShort.indexOf(monthStr);
      if (month === -1) return null;
      const date = new Date(year, month, day);
      return isNaN(date) ? null : date;
    }

    // Фоллбэк на нативный парсер JS
    const fallback = new Date(str);
    return isNaN(fallback) ? null : fallback;
  }

  // Сброс ошибки при новом вводе
  input.addEventListener('input', () => input.setCustomValidity(''));
</script>
{% endblock %}
